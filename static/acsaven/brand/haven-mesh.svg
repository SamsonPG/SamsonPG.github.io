<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Acsaven Haven Horizon">
  <title>Acsaven Haven Horizon v5 � wallpaper landscape</title>
  <desc>Dark-mode composite: slate sky, dawn ribbon, star swirl, lit dunes. Light variants in haven-*-light.svg.</desc>
  <defs>
