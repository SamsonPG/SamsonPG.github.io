<?xml version="1.0" encoding="UTF-8"?>
<!--
  Acsaven cinema-hero atmosphere — for Adobe Illustrator.
  Artboard: 1600 × 900 (16:9).

  How to open: File > Open > this SVG.
  Named groups (use as layers in Illustrator):
    3 Stars   = brand/haven-stars.svg
    2 Veil    = brand/haven-veil.svg
    1 Base wash = SVG stand-in for CSS .acsaven-haven-mesh

  Site also applies CSS blur(36px) + scale(1.12) on the whole stack.
  Source layers alone (no blur): haven-veil.svg, haven-stars.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:i="http://ns.adobe.com/AdobeIllustrator/10.0/"
     viewBox="0 0 1600 900"
     width="1600"
     height="900"
     role="img"
     aria-label="Acsaven hero atmosphere">
  <title>Acsaven hero atmosphere (Illustrator export)</title>
  <desc>Editable layered composite of the live cinema-hero background. Open in Illustrator; edit groups as layers.</desc>

  <defs>
    <!-- Soft preview matching .cinema-hero-atmosphere { filter: blur(36px) } -->
    <filter id="site-atmosphere-blur" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="18" />
    </filter>

    <!-- Base wash — approximates CSS .acsaven-haven-mesh grayscale field -->
    <linearGradient id="wash-void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0b" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>
    <radialGradient id="wash-corner-tl" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-corner-br" cx="100%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-silver" cx="50%" cy="36%" r="48%" gradientTransform="scale(1 0.875)">
      <stop offset="0%" stop-color="#e5e7eb" stop-opacity="0.32" />
      <stop offset="68%" stop-color="#e5e7eb" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-mist" cx="18%" cy="30%" r="58%" gradientTransform="scale(1 0.935)">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#9ca3af" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-cloud" cx="86%" cy="24%" r="55%" gradientTransform="scale(1 0.9)">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.34" />
      <stop offset="68%" stop-color="#d1d5db" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-steel" cx="28%" cy="68%" r="50%" gradientTransform="scale(1 0.92)">
      <stop offset="0%" stop-color="#6b7280" stop-opacity="0.3" />
      <stop offset="64%" stop-color="#6b7280" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-ash" cx="78%" cy="72%" r="52%" gradientTransform="scale(1 0.86)">
      <stop offset="0%" stop-color="#4b5563" stop-opacity="0.36" />
      <stop offset="66%" stop-color="#4b5563" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="wash-band" cx="50%" cy="62%" r="70%" gradientTransform="scale(1 0.4)">
      <stop offset="0%" stop-color="#e5e7eb" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#e5e7eb" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ========== LAYER 1: Base wash ========== -->
  <g id="layer-1-base-wash" data-name="1 Base wash (CSS mesh)">
    <rect width="1600" height="900" fill="url(#wash-void)" />
    <rect width="1600" height="900" fill="url(#wash-corner-tl)" style="mix-blend-mode:multiply" />
    <rect width="1600" height="900" fill="url(#wash-corner-br)" style="mix-blend-mode:multiply" />
    <rect width="1600" height="900" fill="url(#wash-silver)" style="mix-blend-mode:screen" />
    <rect width="1600" height="900" fill="url(#wash-mist)" style="mix-blend-mode:screen" />
    <rect width="1600" height="900" fill="url(#wash-cloud)" style="mix-blend-mode:screen" />
    <rect width="1600" height="900" fill="url(#wash-steel)" style="mix-blend-mode:soft-light" />
    <rect width="1600" height="900" fill="url(#wash-ash)" style="mix-blend-mode:soft-light" />
    <rect width="1600" height="900" fill="url(#wash-band)" style="mix-blend-mode:soft-light" />
  </g>

  <!-- ========== LAYER 2: Veil ========== -->
  <g id="layer-2-veil" data-name="2 Veil (haven-veil.svg)" opacity="1">
    <defs>
    <radialGradient id="veil-ring" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#e5e7eb" stop-opacity="0" />
      <stop offset="82%" stop-color="#e5e7eb" stop-opacity="0.24" />
      <stop offset="90%" stop-color="#9ca3af" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#9ca3af" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="veil-petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="0" />
      <stop offset="40%" stop-color="#d1d5db" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#6b7280" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#e5e7eb" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="veil-petalR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ca3af" stop-opacity="0" />
      <stop offset="40%" stop-color="#d1d5db" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#4b5563" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#e5e7eb" stop-opacity="0" />
    </linearGradient>
    <filter id="veil-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="veil-softer" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <ellipse cx="320" cy="420" rx="380" ry="220" fill="url(#veil-petal)" filter="url(#veil-softer)" transform="rotate(-18 320 420)" />
  <ellipse cx="1280" cy="420" rx="380" ry="220" fill="url(#veil-petalR)" filter="url(#veil-softer)" transform="rotate(18 1280 420)" />

  <path filter="url(#veil-soft)" fill="#0a0a0b" opacity="0.4"
    d="M0 900 C280 720 520 680 800 700 C1080 680 1320 720 1600 900 Z" />
  <path filter="url(#veil-softer)" fill="#1f1f23" opacity="0.3"
    d="M0 900 C320 780 560 760 800 770 C1040 760 1280 780 1600 900 Z" />

  <g transform="translate(800 340)" opacity="0.9">
    <circle r="210" fill="url(#veil-ring)" filter="url(#veil-soft)" />
    <circle r="300" fill="url(#veil-ring)" filter="url(#veil-soft)" opacity="0.75" />
    <circle r="400" fill="url(#veil-ring)" filter="url(#veil-soft)" opacity="0.55" />
  </g>

  <g fill="#ffffff">
    <circle cx="520" cy="220" r="1.6" opacity="0.85" />
    <circle cx="640" cy="180" r="1.1" opacity="0.65" />
    <circle cx="980" cy="200" r="1.4" opacity="0.8" />
    <circle cx="1100" cy="160" r="2" opacity="0.9" />
    <circle cx="1180" cy="240" r="1.2" opacity="0.7" />
    <circle cx="420" cy="300" r="1" opacity="0.55" />
    <circle cx="1280" cy="320" r="1.1" opacity="0.6" />
    <circle cx="760" cy="150" r="1.3" opacity="0.75" />
    <circle cx="880" cy="140" r="0.9" opacity="0.5" />
  </g>
  </g>

  <!-- ========== LAYER 3: Stars ========== -->
  <g id="layer-3-stars" data-name="3 Stars (haven-stars.svg)" opacity="0.55" style="mix-blend-mode:screen">
    <defs>
    <radialGradient id="stars-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- C-shaped constellation (open right) — sits behind brand, not covering CTAs -->
  <g fill="#ffffff">
    <!-- dense arc -->
    <circle cx="520" cy="280" r="1.2" opacity="0.85" />
    <circle cx="560" cy="250" r="0.9" opacity="0.7" />
    <circle cx="600" cy="230" r="1.4" opacity="0.9" />
    <circle cx="640" cy="215" r="0.8" opacity="0.65" />
    <circle cx="680" cy="208" r="1.1" opacity="0.8" />
    <circle cx="720" cy="205" r="1.6" opacity="0.95" />
    <circle cx="760" cy="210" r="0.9" opacity="0.7" />
    <circle cx="800" cy="220" r="1.2" opacity="0.85" />
    <circle cx="840" cy="240" r="1" opacity="0.75" />
    <circle cx="870" cy="270" r="1.3" opacity="0.9" />
    <circle cx="885" cy="310" r="0.8" opacity="0.6" />
    <circle cx="880" cy="350" r="1.1" opacity="0.8" />
    <circle cx="855" cy="385" r="1.5" opacity="0.95" />
    <circle cx="815" cy="410" r="1" opacity="0.75" />
    <circle cx="770" cy="425" r="1.2" opacity="0.85" />
    <circle cx="720" cy="432" r="0.9" opacity="0.7" />
    <circle cx="670" cy="428" r="1.3" opacity="0.9" />
    <circle cx="625" cy="412" r="1" opacity="0.75" />
    <circle cx="590" cy="385" r="1.4" opacity="0.9" />
    <circle cx="565" cy="350" r="0.8" opacity="0.65" />
    <circle cx="550" cy="315" r="1.1" opacity="0.8" />
    <!-- fill density -->
    <circle cx="610" cy="260" r="0.6" opacity="0.5" />
    <circle cx="650" cy="245" r="0.7" opacity="0.55" />
    <circle cx="700" cy="235" r="0.5" opacity="0.45" />
    <circle cx="750" cy="238" r="0.7" opacity="0.55" />
    <circle cx="790" cy="255" r="0.6" opacity="0.5" />
    <circle cx="820" cy="290" r="0.7" opacity="0.55" />
    <circle cx="830" cy="330" r="0.5" opacity="0.45" />
    <circle cx="810" cy="365" r="0.6" opacity="0.5" />
    <circle cx="780" cy="390" r="0.7" opacity="0.55" />
    <circle cx="740" cy="405" r="0.5" opacity="0.45" />
    <circle cx="700" cy="410" r="0.6" opacity="0.5" />
    <circle cx="660" cy="400" r="0.7" opacity="0.55" />
    <circle cx="630" cy="370" r="0.5" opacity="0.45" />
    <circle cx="600" cy="340" r="0.6" opacity="0.5" />
    <circle cx="585" cy="300" r="0.7" opacity="0.55" />
    <!-- sparkles (4-point feel via larger soft dots) -->
    <circle cx="720" cy="205" r="2.2" fill="url(#stars-glow)" opacity="0.9" />
    <circle cx="855" cy="385" r="2.4" fill="url(#stars-glow)" opacity="0.85" />
    <circle cx="600" cy="230" r="2" fill="url(#stars-glow)" opacity="0.8" />
    <!-- lone bright star upper-right -->
    <circle cx="1180" cy="160" r="1.8" opacity="0.95" />
    <circle cx="1180" cy="160" r="3.5" fill="url(#stars-glow)" opacity="0.7" />
    <circle cx="1320" cy="220" r="0.9" opacity="0.55" />
    <circle cx="1080" cy="120" r="0.7" opacity="0.45" />
    <circle cx="420" cy="180" r="0.8" opacity="0.5" />
    <circle cx="980" cy="300" r="0.6" opacity="0.4" />
    <circle cx="480" cy="400" r="0.7" opacity="0.45" />
  </g>
  </g>

  <!-- ========== LAYER 4: Soft blur preview (hide in AI if editing vectors) ========== -->
  <!-- Duplicate stack under blur is heavy; instead document the site filter.
       Uncomment below if you want a blurred flat preview group:
  <g id="layer-4-blur-preview" data-name="4 Soft blur preview" filter="url(#site-atmosphere-blur)" opacity="0" pointer-events="none">
  </g>
  -->
</svg>
