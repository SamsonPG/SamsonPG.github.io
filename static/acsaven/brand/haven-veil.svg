<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-hidden="true">
  <title>Acsaven Haven Aura — soft mist</title>
  <desc>Soft charcoal/silver mist without hard ring edges. Same-origin only.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5e7eb" stop-opacity="0.28" />
      <stop offset="35%" stop-color="#d1d5db" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#9ca3af" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="petal" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#6b7280" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="petalR" cx="70%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#d1d5db" stop-opacity="0.2" />
      <stop offset="45%" stop-color="#4b5563" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0a0a0b" stop-opacity="0" />
    </radialGradient>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42" />
    </filter>
    <filter id="hazeSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="64" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#0a0a0b" />

  <ellipse cx="320" cy="400" rx="520" ry="320" fill="url(#petal)" filter="url(#hazeSoft)" />
  <ellipse cx="1280" cy="400" rx="520" ry="320" fill="url(#petalR)" filter="url(#hazeSoft)" />
  <ellipse cx="800" cy="340" rx="560" ry="380" fill="url(#glow)" filter="url(#haze)" />
  <ellipse cx="800" cy="420" rx="420" ry="260" fill="url(#glow)" filter="url(#hazeSoft)" opacity="0.7" />

  <g fill="#ffffff">
    <circle cx="520" cy="220" r="1.4" opacity="0.55" />
    <circle cx="640" cy="180" r="1" opacity="0.4" />
    <circle cx="980" cy="200" r="1.2" opacity="0.5" />
    <circle cx="1100" cy="160" r="1.6" opacity="0.55" />
    <circle cx="1180" cy="240" r="1" opacity="0.4" />
    <circle cx="420" cy="300" r="0.9" opacity="0.35" />
    <circle cx="1280" cy="320" r="1" opacity="0.4" />
    <circle cx="760" cy="150" r="1.1" opacity="0.45" />
    <circle cx="880" cy="140" r="0.8" opacity="0.3" />
  </g>
</svg>
