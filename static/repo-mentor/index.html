<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../offline-guard.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Repo Mentor — offline demo</title>
  <meta name="description" content="Offline homepage capture for Repo Mentor when repomentor.acsaven.com is blocked." />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://repomentor.acsaven.com/" />
  <meta name="theme-color" content="#0b1220" />
  <style>
    :root { color-scheme: dark; --ink:#e8eef5; --muted:#9aabbc; --accent:#2dd4bf; --bg:#0b1220; }
    body { margin:0; font-family: system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
    .shot { width:100%; border-radius:14px; border:1px solid #243044; margin:1.25rem 0; }
    a { color: var(--accent); }
    .meta { color: var(--muted); font-size: .9rem; }
    h1 { font-size: 1.75rem; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="meta">Offline demo · Acsaven Lab</p>
    <h1>Repo Mentor</h1>
    <p>Scan → brain → teach. Offline-first codebase onboarding. This page is a static capture for when the live domain is blocked.</p>
    <img class="shot" src="./shot.svg" alt="Repo Mentor knowledge-graph cover" width="1600" height="900" />
    <p><a href="https://repomentor.acsaven.com/">Open live →</a> · <a href="https://github.com/acsavenhq/repo-mentor">Source</a> · <a href="../">All demos</a></p>
  </main>
</body>
</html>
