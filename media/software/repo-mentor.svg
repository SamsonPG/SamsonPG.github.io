  <text x="96" y="160" fill="#E8EEF5" font-family="Georgia, 'Source Serif 4', serif" font-size="72" font-weight="600">Repo Mentor</text>
  <text x="96" y="230" fill="#2DD4BF" font-family="ui-monospace, monospace" font-size="28" letter-spacing="4">BY ACSAVEN · COGNITIVE LAB</text>
  <text x="96" y="320" fill="#9AABBC" font-family="system-ui, sans-serif" font-size="34">Scan → brain → teach. Offline-first codebase onboarding.</text>
