  <circle cx="1180" cy="280" r="220" fill="#0F766E" opacity="0.12"/>
  <circle cx="380" cy="640" r="180" fill="#0284C7" opacity="0.1"/>

  <!-- Knowledge DAG -->
  <g stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M620 280L760 400"/>
