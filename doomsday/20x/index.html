<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="description" content="20X is the all-in-one healthcare staffing CRM and nurse scheduling software for agencies in the UK, US, and Canada." />
  <meta name="robots" content="noindex,follow" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#0f172a}
    .top{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;gap:.75rem;
      padding:.7rem clamp(1rem,3vw,1.75rem);

      border-bottom:1px solid #e5e7eb;
    }
    .logo{font-weight:800;letter-spacing:-.05em;font-size:1.2rem;text-decoration:none;color:#0f172a}
    .nav{display:none;gap:1rem;font-size:.88rem;font-weight:600;color:#64748b}
    .nav a{text-decoration:none;color:inherit}
    @media(min-width:900px){.nav{display:flex}}
    .actions{display:flex;gap:.5rem;align-items:center}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;
      min-height:2.75rem;padding:.5rem 1.1rem;border-radius:.65rem;
      font-weight:750;font-size:.9rem;text-decoration:none;border:1px solid transparent;
    }
    .btn--fill{background:#2563eb;color:#fff}
    .btn--line{background:#fff;border-color:#cbd5e1;color:#0f172a}
    .page{width:100%;height:auto;display:block;vertical-align:top}

</head>
<body>
  <header class="top">
    <a class="logo" href="./">20X</a>
    <nav class="nav" aria-label="Primary">
      <a href="#page">Home</a>

      <a href="#page">About</a>
      <a href="#page">Contact</a>
    </nav>
    <div class="actions">
      <a class="btn btn--line" href="#page">Explore 20X</a>
      <a class="btn btn--fill" href="#page">Book a demo</a>
    </div>
  </header>
  <img id="page" class="page" src="./home-full.webp" width="1440" height="7639" alt="20X — Healthcare Staffing CRM and Nurse Scheduling Software full homepage" loading="eager" decoding="async" />
