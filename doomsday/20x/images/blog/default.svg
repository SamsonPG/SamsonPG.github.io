<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="400" fill="url(#gradient7)"/>
  <defs>
    <linearGradient id="gradient7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9ca3af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Default blog image -->
  <g transform="translate(250, 120)">
    <!-- Document icon -->
    <rect x="50" y="50" width="200" height="140" rx="8" fill="white" fill-opacity="0.9"/>
    <rect x="70" y="70" width="160" height="8" fill="#6b7280"/>
    <rect x="70" y="90" width="140" height="6" fill="#9ca3af"/>
    <rect x="70" y="105" width="120" height="6" fill="#9ca3af"/>
    <rect x="70" y="120" width="160" height="6" fill="#9ca3af"/>
    <rect x="70" y="135" width="100" height="6" fill="#9ca3af"/>
  </g>
  
  <!-- Title overlay -->
  <text x="400" y="320" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="28" font-weight="bold">
    Byte River Blog
  </text>
  <text x="400" y="350" text-anchor="middle" fill="white" fill-opacity="0.8" font-family="Arial, sans-serif" font-size="16">
    Healthcare Technology Insights
  </text>
</svg>