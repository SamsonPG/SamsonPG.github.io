<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-hidden="true">
  <title>Acsaven Haven Aura — light grayscale (stronger inverse)</title>
  <desc>Deeper charcoal mist on gray paper — mirrors dark mode presence. Same-origin only.</desc>
  <defs>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#27272a" stop-opacity="0" />
      <stop offset="82%" stop-color="#27272a" stop-opacity="0.22" />
      <stop offset="90%" stop-color="#52525b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#52525b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0" />
      <stop offset="40%" stop-color="#52525b" stop-opacity="0.42" />
      <stop offset="70%" stop-color="#27272a" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#71717a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="petalR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0" />
      <stop offset="40%" stop-color="#3f3f46" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#18181b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#71717a" stop-opacity="0" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" />
    </filter>
    <filter id="softer" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <ellipse cx="320" cy="420" rx="400" ry="240" fill="url(#petal)" filter="url(#softer)" transform="rotate(-18 320 420)" />
  <ellipse cx="1280" cy="420" rx="400" ry="240" fill="url(#petalR)" filter="url(#softer)" transform="rotate(18 1280 420)" />

  <path filter="url(#soft)" fill="#52525b" opacity="0.35"
    d="M0 900 C280 700 520 660 800 680 C1080 660 1320 700 1600 900 Z" />
  <path filter="url(#softer)" fill="#a1a1aa" opacity="0.4"
    d="M0 900 C320 760 560 740 800 750 C1040 740 1280 760 1600 900 Z" />

  <g transform="translate(800 340)" opacity="0.95">
    <circle r="210" fill="url(#ring)" filter="url(#soft)" />
    <circle r="300" fill="url(#ring)" filter="url(#soft)" opacity="0.8" />
    <circle r="400" fill="url(#ring)" filter="url(#soft)" opacity="0.6" />
  </g>

  <g fill="#27272a">
    <circle cx="520" cy="220" r="1.8" opacity="0.45" />
    <circle cx="640" cy="180" r="1.2" opacity="0.35" />
    <circle cx="980" cy="200" r="1.5" opacity="0.4" />
    <circle cx="1100" cy="160" r="2.2" opacity="0.5" />
    <circle cx="1180" cy="240" r="1.3" opacity="0.35" />
    <circle cx="760" cy="150" r="1.4" opacity="0.4" />
  </g>
</svg>
