<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acsaven — private Try tools that stay with you</title>
  <meta name="description" content="Tools that stay with you. Parent studio behind the Try family." />
  <meta name="robots" content="noindex,follow" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#0f172a}
    .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem clamp(1rem,3vw,1.75rem);background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb}
    .logo{font-weight:800;letter-spacing:-.05em;font-size:1.1rem;text-decoration:none;color:#0f172a;display:inline-flex;align-items:center;gap:.4rem}
    .domain{display:none;font-size:.78rem;font-weight:650;color:#64748b}
    @media(min-width:640px){.domain{display:inline}}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:.5rem 1.1rem;border-radius:.65rem;font-weight:750;font-size:.9rem;text-decoration:none;border:1px solid transparent;background:#334155;color:#fff}
    .page{width:100%;height:auto;display:block}
  </style>
</head>
<body>
  <header class="top">
    <a class="logo" href="./">Acsaven <span class="domain">acsaven.com</span></a>
    <a class="btn" href="#page">Pick a tool</a>
  </header>
  <img id="page" class="page" src="./home-full.webp" width="1440" alt="Acsaven homepage" loading="eager" decoding="async" />
</body>
</html>
